name: Generate snake animation

on:
  schedule: # twice a day, at 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # "Microscope stain" palette, matching the README banner: empty, then four contribution levels.
      - name: generate snake.svg (light and dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0a7ea4&color_dots=#ebedf0,#f3c6d6,#e49ab4,#b07cc6,#6f42c1
            dist/github-snake-dark.svg?color_snake=#39c5e0&color_dots=#161b22,#3d2233,#74395a,#8e5bc4,#b69bff

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
